<!DOCTYPE html>
<html>
<head>
	<title>My Discord OAuth2 App</title>
</head>
<body>
	<a id="login" style="display: none;" href="https://discord.com/api/oauth2/authorize?client_id=844936986115833858&redirect_uri=https%3A%2F%2Fpersonalemoji.herokuapp.com&response_type=code&scope=identify">Identify Yourself</a>
	<script>
	function generateRandomString() {
		let randomString = '';
		const randomNumber = Math.floor(Math.random() * 10);
		for (let i = 0; i < 20 + randomNumber; i++) {randomString += String.fromCharCode(33 + Math.floor(Math.random() * 94));}
		return randomString;
	}
	window.onload = () => {
		fragment = new URLSearchParams(window.location.hash.slice(1));
		const [accessToken, tokenType, state] = [fragment.get('access_token'), fragment.get('token_type'), fragment.get('state')];
		
		const queryString = window.location.search;
		const urlParams = new URLSearchParams(queryString);
		const code = urlParams.get('code')
		if(code!=null){
			location.href='login'
		}
		
		if (!accessToken) {
			const randomString = generateRandomString();
			localStorage.setItem('oauth-state', randomString);
			document.getElementById('login').href += `&state=${btoa(randomString)}`;
			return document.getElementById('login').style.display = 'block';
		}
		
	};
	</script>
</body>
</html>
